apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cloud-agents.fullname" . }}-migrate
  labels:
    {{- include "cloud-agents.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "cloud-agents.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "cloud-agents.image" .Values.images.migrate | quote }}
          imagePullPolicy: {{ .Values.images.migrate.pullPolicy }}
          env:
            - name: CLOUD_AGENTS_PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.migrationURLKey }}
