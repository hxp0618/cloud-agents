apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-agents.fullname" . }}-access-gateway
  labels:
    {{- include "cloud-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: access-gateway
spec:
  type: {{ .Values.accessGateway.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: access-gateway
  ports:
    - name: https
      port: {{ .Values.accessGateway.service.httpsPort }}
      targetPort: https
    - name: ssh
      port: {{ .Values.accessGateway.service.sshPort }}
      targetPort: ssh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-agents.fullname" . }}-access-gateway
  labels:
    {{- include "cloud-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: access-gateway
spec:
  replicas: {{ .Values.accessGateway.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: access-gateway
  template:
    metadata:
      labels:
        {{- include "cloud-agents.labels" . | nindent 8 }}
        app.kubernetes.io/component: access-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-ssh-host-key
          image: {{ include "cloud-agents.image" .Values.images.migrate | quote }}
          imagePullPolicy: {{ .Values.images.migrate.pullPolicy }}
          command: ["/usr/bin/install"]
          args: ["--mode=0400", "/source/ssh-host-key", "/target/ssh-host-key"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ssh-host-key-source
              mountPath: /source
              readOnly: true
            - name: ssh-host-key
              mountPath: /target
      containers:
        - name: access-gateway
          image: {{ include "cloud-agents.image" .Values.images.accessGateway | quote }}
          imagePullPolicy: {{ .Values.images.accessGateway.pullPolicy }}
          args:
            - --listen
            - :8090
            - --tls-cert
            - /run/cloud-agents/tls/tls.crt
            - --tls-key
            - /run/cloud-agents/tls/tls.key
            - --ssh-listen
            - :2222
            - --ssh-host-key
            - /run/cloud-agents/secrets/ssh-host-key
          env:
            - name: CLOUD_AGENTS_PLATFORM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.runtimeURLKey }}
            {{- if .Values.deploymentTargets.kubernetesCredentialSecretName }}
            - name: CLOUD_AGENTS_PLATFORM_KUBERNETES_CREDENTIALS_DIRECTORY
              value: /run/cloud-agents/kubernetes-target-credentials
            {{- end }}
          ports:
            - name: https
              containerPort: 8090
            - name: ssh
              containerPort: 2222
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          resources:
            {{- toYaml .Values.accessGateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /run/cloud-agents/tls
              readOnly: true
            - name: ssh-host-key
              mountPath: /run/cloud-agents/secrets
              readOnly: true
            {{- if .Values.deploymentTargets.kubernetesCredentialSecretName }}
            - name: kubernetes-target-credentials
              mountPath: /run/cloud-agents/kubernetes-target-credentials
              readOnly: true
            {{- end }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.accessGatewaySecretName }}
            defaultMode: 0440
        - name: ssh-host-key-source
          secret:
            secretName: {{ .Values.accessGateway.sshHostKeySecretName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.accessGateway.sshHostKeyKey }}
                path: ssh-host-key
        - name: ssh-host-key
          emptyDir:
            medium: Memory
        {{- if .Values.deploymentTargets.kubernetesCredentialSecretName }}
        - name: kubernetes-target-credentials
          secret:
            secretName: {{ .Values.deploymentTargets.kubernetesCredentialSecretName }}
            defaultMode: 0440
        {{- end }}
