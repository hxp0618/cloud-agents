apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-agents.fullname" . }}-worker
  labels:
    {{- include "cloud-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
  ports:
    - name: mtls
      port: {{ .Values.worker.service.port }}
      targetPort: mtls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-agents.fullname" . }}-worker
  labels:
    {{- include "cloud-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "cloud-agents.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ include "cloud-agents.image" .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          args:
            - --listen
            - :8091
            - --tls-cert
            - /run/cloud-agents/tls/tls.crt
            - --tls-key
            - /run/cloud-agents/tls/tls.key
            - --client-ca
            - /run/cloud-agents/tls/ca.crt
            - --worker-spiffe-id
            - {{ .Values.controlPlane.workerSPIFFEID | quote }}
            - --runtime-command
            - /usr/local/bin/cloud-agent-runtime
            - --runtime-directory
            - /workspace
            - --runtime-max-sessions
            - {{ .Values.runtime.maxSessions | quote }}
            - --provider-credential-directory
            - /run/cloud-agents/provider-credentials
          env:
            - name: CLOUD_AGENTS_ADMISSION_LEASE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admission.secretName }}
                  key: {{ .Values.admission.leaseIDKey }}
            - name: CLOUD_AGENTS_ADMISSION_GENERATION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admission.secretName }}
                  key: {{ .Values.admission.generationKey }}
            - name: CLOUD_AGENTS_ADMISSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admission.secretName }}
                  key: {{ .Values.admission.tokenKey }}
          envFrom:
            - secretRef:
                name: {{ .Values.runtime.environmentSecretName }}
          ports:
            - name: mtls
              containerPort: 8091
          readinessProbe:
            tcpSocket:
              port: mtls
          livenessProbe:
            tcpSocket:
              port: mtls
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /run/cloud-agents/tls
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: runtime-tmp
              mountPath: /tmp
            - name: provider-credentials
              mountPath: /run/cloud-agents/provider-credentials
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.workerSecretName }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "cloud-agents.workspaceClaim" . }}
        - name: runtime-tmp
          emptyDir: {}
        - name: provider-credentials
          secret:
            secretName: {{ .Values.runtime.credentialSecretName }}
