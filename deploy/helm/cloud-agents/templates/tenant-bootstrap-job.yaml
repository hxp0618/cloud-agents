{{- if .Values.tenantBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cloud-agents.fullname" . }}-tenant-bootstrap
  labels:
    {{- include "cloud-agents.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "cloud-agents.labels" . | nindent 8 }}
        app.kubernetes.io/component: tenant-bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tenant-bootstrap
          image: {{ include "cloud-agents.image" .Values.images.migrate | quote }}
          imagePullPolicy: {{ .Values.images.migrate.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              exec psql "$CLOUD_AGENTS_TENANT_BOOTSTRAP_DATABASE_URL" -X -P pager=off --single-transaction -v ON_ERROR_STOP=1 \
                -v cloud_agents_tenant_uid="$CLOUD_AGENTS_TENANT_UID" \
                -v cloud_agents_tenant_name="$CLOUD_AGENTS_TENANT_NAME" \
                -v cloud_agents_tenant_display_name="$CLOUD_AGENTS_TENANT_DISPLAY_NAME" \
                -v cloud_agents_organization_uid="$CLOUD_AGENTS_ORGANIZATION_UID" \
                -v cloud_agents_organization_name="$CLOUD_AGENTS_ORGANIZATION_NAME" \
                -v cloud_agents_organization_display_name="$CLOUD_AGENTS_ORGANIZATION_DISPLAY_NAME" \
                -v cloud_agents_admin_subject_kind="$CLOUD_AGENTS_ADMIN_SUBJECT_KIND" \
                -v cloud_agents_admin_subject_issuer="$CLOUD_AGENTS_ADMIN_SUBJECT_ISSUER" \
                -v cloud_agents_admin_subject_value="$CLOUD_AGENTS_ADMIN_SUBJECT_VALUE" \
                -v cloud_agents_admin_membership_uid="$CLOUD_AGENTS_ADMIN_MEMBERSHIP_UID" \
                -v cloud_agents_admin_membership_name="$CLOUD_AGENTS_ADMIN_MEMBERSHIP_NAME" \
                -v cloud_agents_admin_role_binding_uid="$CLOUD_AGENTS_ADMIN_ROLE_BINDING_UID" \
                -v cloud_agents_admin_role_binding_name="$CLOUD_AGENTS_ADMIN_ROLE_BINDING_NAME" \
                -v cloud_agents_tenant_audit_fact_uid="$CLOUD_AGENTS_TENANT_AUDIT_FACT_UID" \
                -v cloud_agents_membership_audit_fact_uid="$CLOUD_AGENTS_MEMBERSHIP_AUDIT_FACT_UID" \
                -v cloud_agents_role_binding_audit_fact_uid="$CLOUD_AGENTS_ROLE_BINDING_AUDIT_FACT_UID" \
                -v cloud_agents_bootstrap_reason_code="$CLOUD_AGENTS_BOOTSTRAP_REASON_CODE" <<'SQL'
{{ .Files.Get "files/tenant-bootstrap.sql" | indent 14 }}
              SQL
          env:
            - name: CLOUD_AGENTS_TENANT_BOOTSTRAP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.tenantBootstrapURLKey }}
          envFrom:
            - secretRef:
                name: {{ .Values.tenantBootstrap.secretName }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
