images:
  controlPlane:
    repository: cloud-agents/control-plane
    tag: 0.2.0
    digest: ""
    pullPolicy: IfNotPresent
  identity:
    repository: cloud-agents/identity
    tag: 0.2.0
    digest: ""
    pullPolicy: IfNotPresent
  worker:
    repository: cloud-agents/worker
    tag: 0.2.0
    digest: ""
    pullPolicy: IfNotPresent
  migrate:
    repository: cloud-agents/migrate
    tag: 0.2.0
    digest: ""
    pullPolicy: IfNotPresent
  accessGateway:
    repository: cloud-agents/access-gateway
    tag: 0.2.0
    digest: ""
    pullPolicy: IfNotPresent
  adminWeb:
    repository: cloud-agents/admin-web
    tag: 0.2.0
    digest: ""
    pullPolicy: IfNotPresent
  userWeb:
    repository: cloud-agents/user-web
    tag: 0.2.0
    digest: ""
    pullPolicy: IfNotPresent

database:
  secretName: cloud-agents-database
  runtimeURLKey: runtime-url
  migrationURLKey: migration-url
  tenantBootstrapURLKey: tenant-bootstrap-url
  identityServiceURLKey: identity-service-url
  identityBootstrapURLKey: identity-bootstrap-url

tenantBootstrap:
  enabled: false
  secretName: cloud-agents-tenant-bootstrap

identity:
  replicas: 1
  issuer: https://identity.cloud-agents.example
  adminAudience: https://admin.cloud-agents.example
  userAudience: https://user.cloud-agents.example
  signingKeyId: identity-signing-1
  service:
    port: 8443
  tls:
    secretName: cloud-agents-identity-tls
    certificateKey: tls.crt
    privateKeyKey: tls.key
    caKey: ca.crt
  signing:
    secretName: cloud-agents-identity-signing
    privateKeyKey: signing.key
  csrf:
    secretName: cloud-agents-identity-csrf
    key: csrf.key
  providerFlow:
    secretName: cloud-agents-identity-provider-flow
    key: provider-flow.key
  providers:
    secretName: ""
    clientSecrets: {}
    rootCAs: {}
  credentials:
    secretName: cloud-agents-identity-service-proofs
    adminWebKey: admin-web.proof
    userWebKey: user-web.proof
    controlPlaneKey: control-plane.proof
    controlPlaneAuthorizationKey: identity-control-plane.proof
  resources: {}

identityBootstrap:
  enabled: false
  secretName: cloud-agents-identity-bootstrap
  setupProofKey: setup.proof
  passwordHashKey: password.hash
  userId: initial-admin
  email: admin@example.com
  displayName: Initial administrator
  keyNotBefore: ""
  keyNotAfter: ""

accessGrant:
  secretName: cloud-agents-access-grant
  key: access-grant.key

tls:
  controlPlaneSecretName: cloud-agents-control-plane-tls
  controlPlaneCAKey: ca.crt
  workerSecretName: cloud-agents-worker-tls
  workerClientSecretName: cloud-agents-worker-client-tls
  accessGatewaySecretName: cloud-agents-access-gateway-tls

admission:
  secretName: cloud-agents-admission
  leaseIDKey: lease-id
  generationKey: generation
  tokenKey: token

runtime:
  maxSessions: 4
  environmentSecretName: cloud-agents-runtime-env
  credentialSecretName: cloud-agents-provider-credentials
  # Optional operator-owned files: <tenant-id>.capabilities.json (mode 0600).
  capabilityMaterializationSecretName: ""
  workspace:
    existingClaim: ""
    storageClassName: ""
    size: 20Gi
  snapshot:
    existingClaim: ""
    storageClassName: ""
    size: 20Gi

controlPlane:
  replicas: 1
  maxConcurrentRequests: 128
  service:
    type: ClusterIP
    port: 8080
  workerSPIFFEID: spiffe://cloud-agents.example/worker
  resources: {}

deploymentTargets:
  kubernetesCredentialSecretName: cloud-agents-kubernetes-targets
  sshCredentialSecretName: ""
  # Secret with key target-credential.key (exactly 32 bytes) that seals
  # kubeconfig credentials registered from Admin Web. Empty disables them.
  credentialKeySecretName: ""

remoteWorker:
  certificateAuthoritySecretName: ""
  trustDomain: ""

worker:
  enabled: false
  replicas: 1
  service:
    port: 8091
  resources: {}

accessGateway:
  replicas: 1
  sshHostKeySecretName: cloud-agents-access-gateway-ssh
  sshHostKeyKey: ssh-host-key
  service:
    type: ClusterIP
    httpsPort: 8090
    sshPort: 2222
  resources: {}

adminWeb:
  replicas: 1
  tlsSecretName: cloud-agents-admin-web-tls
  tlsCertificateKey: tls.crt
  tlsPrivateKeyKey: tls.key
  trustedProxyIP: ""
  controlPlaneCASecretName: cloud-agents-control-plane-tls
  controlPlaneCAKey: ca.crt
  service:
    type: ClusterIP
    port: 4174
  resources: {}

userWeb:
  replicas: 1
  tlsSecretName: cloud-agents-user-web-tls
  tlsCertificateKey: tls.crt
  tlsPrivateKeyKey: tls.key
  trustedProxyIP: ""
  controlPlaneCASecretName: cloud-agents-control-plane-tls
  controlPlaneCAKey: ca.crt
  service:
    type: ClusterIP
    port: 4173
  resources: {}

networkPolicy:
  enabled: true
