name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify public evidence mirror
        run: bun run public:evidence:check
      - run: bun run fmt:check
      - run: bun run lint
      - run: python3 -B -m unittest discover -s test/scripts -p "*_test.py"
      - run: bash -n scripts/cloud-agents-dev.sh test/e2e/test-cloud-agents-dev.sh test/scripts/test-cloud-agents-helm.sh test/e2e/test-platform-compose.sh test/e2e/test-platform-oci-images.sh
      - run: sh test/scripts/test-cloud-agents-helm.sh
      - run: bash test/e2e/test-cloud-agents-dev.sh
      - run: bun run platform:go:check
      - run: bun run platform:contracts:check
      - run: bun run platform:migrations:check
      - run: sh test/scripts/test-platform-go-products.sh
      - run: bun run platform:sdk:consumers
      - run: bun run typecheck
      - run: bun run build
      - run: bunx --no-install @e2e-dev/web install chromium --with-deps
      - run: bun run test:e2e
      - run: bun run --filter '@cloud-agents/*' test
      - run: bunx vitest run test/scripts
      - run: bun run secret:scan
        env:
          CLOUD_AGENT_SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node scripts/cloud-agent-release-smoke.ts --output-dir "${RUNNER_TEMP}/cloud-agent-runtime-candidate"
      - run: sha256sum -c checksums.sha256
        working-directory: ${{ runner.temp }}/cloud-agent-runtime-candidate
      - run: bun run platform:release -- --version 0.0.0-ci --runtime-candidate-dir "${RUNNER_TEMP}/cloud-agent-runtime-candidate" --output-dir "${RUNNER_TEMP}/cloud-agents-platform-candidate"
      - run: sha256sum -c checksums.sha256
        working-directory: ${{ runner.temp }}/cloud-agents-platform-candidate
      - run: |
          cmp "${RUNNER_TEMP}/cloud-agent-runtime-candidate/cloud-agent-runtime-standalone.mjs" "${RUNNER_TEMP}/cloud-agents-platform-candidate/cloud-agent-runtime-standalone.mjs"
          cmp "${RUNNER_TEMP}/cloud-agent-runtime-candidate/cloud-agent-runtime-notices.md" "${RUNNER_TEMP}/cloud-agents-platform-candidate/cloud-agent-runtime-notices.md"
      - run: sh test/e2e/test-platform-oci-images.sh "${RUNNER_TEMP}/cloud-agents-platform-candidate"
      - run: sh test/e2e/test-platform-compose.sh "${RUNNER_TEMP}/cloud-agents-platform-candidate"
