name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run platform:contracts:check
      - run: bun run platform:go:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run secret:scan
      - run: bun run release:smoke -- --output-dir candidate
        env:
          CLOUD_AGENT_RELEASE_PROVENANCE_BUILDER: github-actions
