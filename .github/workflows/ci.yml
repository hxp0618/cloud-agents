name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run secret:scan
      - run: bun run release:smoke -- --output candidate
        env:
          CLOUD_AGENT_RELEASE_PROVENANCE_BUILDER: github-actions
