name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run fmt:check
      - run: bun run lint
      - run: bash -n scripts/cloud-agents-dev.sh scripts/test-cloud-agents-helm.sh
      - run: sh scripts/test-cloud-agents-helm.sh
      - run: bun run platform:go:check
      - run: bun run platform:sdk:check
      - run: sh scripts/test-platform-go-products.sh
      - run: bun run platform:sdk:consumers
      - run: bun run typecheck
      - run: bun run --filter '@synara/*' test
      - run: bunx vitest run scripts/lib/platform-go-modules.test.ts scripts/lib/platform-release.test.ts
      - run: bun run build
      - run: bun run secret:scan
        env:
          CLOUD_AGENT_SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: bun run platform:release -- --version 0.0.0-ci --output-dir "${RUNNER_TEMP}/cloud-agents-platform-candidate"
      - run: sha256sum -c checksums.sha256
        working-directory: ${{ runner.temp }}/cloud-agents-platform-candidate
