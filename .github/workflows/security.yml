name: Security scan

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify public evidence mirror
        run: bun run public:evidence:check
      - name: Verify generator supply evidence
        run: bun scripts/check-generator-supply-evidence.ts --check
      - name: Generate SPDX package inventory
        run: |
          output_directory="$RUNNER_TEMP/cloud-agents-sbom"
          mkdir -p "$output_directory"
          bun scripts/generate-sbom.ts --output-dir "$output_directory"
          test -s "$output_directory/sbom.spdx.json"
      - run: bun run secret:scan
        env:
          CLOUD_AGENT_SECRET_SCAN_ALL_HISTORY: "1"
