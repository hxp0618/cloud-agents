// SPDX-License-Identifier: MIT
//
// Runtime transport authority for the independent Cloud Agents product.
// The JSON bytes carry the Runtime Protocol 2.3 envelope; this contract
// carries only the authenticated Worker session, fencing, and Provider binding.
syntax = "proto3";

package cloudagents.worker.runtime.v1alpha1;

import "contracts/worker/v1alpha1/kernel.proto";

option go_package = "github.com/hxp0618/cloud-agents/sdk/go/gen/cloudagents/worker/runtime/v1alpha1;workerruntimev1alpha1";

message RuntimeSessionOpen {
  cloudagents.worker.v1alpha1.NegotiationBinding negotiation = 1;
  cloudagents.worker.v1alpha1.FencingProof fencing = 2;
  string execution_id = 3;
  uint64 generation = 4;
  cloudagents.worker.v1alpha1.WorkloadIdentity expected_worker_identity = 5;
  // Selects the deployment-owned credential passed to this Runtime process.
  // Every session command that names a Provider must match this binding.
  string provider_kind = 6;
  // Selects the authenticated tenant's deployment-owned Provider credential.
  string tenant_id = 7;
  // Host-managed, short-lived capability bindings. These values are opaque
  // references and digests only; the Worker never receives a user token or
  // host path through this protocol.
  repeated RuntimeCapabilityBinding capability_bindings = 8;
  // Digest of the canonical capability manifest sent to the Runtime process.
  string capability_manifest_digest = 9;
}

message RuntimeCapabilityBinding {
  // "mcp-server" or "skill-bundle"; the Worker rejects all other kinds.
  string resource_kind = 1;
  string resource_id = 2;
  string version = 3;
  string digest = 4;
  // MCP-only transport and connection reference. connection_ref is opaque.
  string transport = 5;
  string connection_ref = 6;
  // Short-lived authorization references; no credential bytes are carried.
  string credential_ref = 7;
  string grant_id = 8;
  string network_policy_ref = 9;
  uint64 expires_at_unix_seconds = 10;
  repeated string permissions = 11;
  // Skill bundles must set this true; MCP bindings must set it false.
  bool read_only = 12;
}

message RuntimeCommandFrame {
  // One complete Runtime Protocol 2.3 command JSON object, without the
  // trailing JSONL newline. The Worker enforces the Runtime byte ceiling.
  bytes json = 1;
}

message RuntimeSessionRequest {
  oneof frame {
    RuntimeSessionOpen open = 1;
    RuntimeCommandFrame command = 2;
  }
}

message RuntimeSessionReady {
  string execution_id = 1;
  uint64 generation = 2;
  uint32 protocol_major = 3;
  uint32 protocol_minor = 4;
}

message RuntimeSessionError {
  string code = 1;
  string message = 2;
}

message RuntimeSessionResponse {
  oneof frame {
    RuntimeSessionReady ready = 1;
    bytes json = 2;
    RuntimeSessionError error = 3;
  }
}

message RuntimeArtifactReadRequest {
  cloudagents.worker.v1alpha1.NegotiationBinding negotiation = 1;
  cloudagents.worker.v1alpha1.FencingProof fencing = 2;
  string execution_id = 3;
  uint64 generation = 4;
  cloudagents.worker.v1alpha1.WorkloadIdentity expected_worker_identity = 5;
  string root_directory = 6;
  string relative_path = 7;
  optional uint64 expected_size_bytes = 8;
  string expected_sha256 = 9;
}

message RuntimeArtifactChunk {
  bytes data = 1;
  uint64 size_bytes = 2;
}

service WorkerRuntimeService {
  // The first request MUST be open. Commands and Runtime messages then use
  // the Runtime Protocol 2.3 JSON envelope without a duplicate protobuf DTO.
  rpc OpenSession(stream RuntimeSessionRequest) returns (stream RuntimeSessionResponse);

  // Reads one ArtifactCandidate beneath its execution-owned Workspace or
  // Runtime Output root. The Worker contains path traversal and size limits.
  rpc ReadArtifact(RuntimeArtifactReadRequest) returns (stream RuntimeArtifactChunk);
}
